  <script>
    const form = document.getElementById('enquiryForm');
    const responseDiv = document.getElementById('enquiryResponse');
    const submitButton = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Disable button and change text
      submitButton.disabled = true;
      submitButton.innerText = 'Sending...';
      responseDiv.innerHTML = ''; // Clear previous messages

      const formData = {
        full_name: form.full_name.value,
        dob: form.dob.value,
        gender: form.gender.value,
        mobile_number: form.mobile_number.value,
        guardian_mobile_number: form.guardian_mobile_number.value,
        qualification: form.qualification.value,
        program_interest: form.program_interest.value,
        city: form.city.value,
        state: form.state.value,
        pincode: form.pincode.value,
        about_yourself: form.about_yourself.value,
        enquiry_message: form.enquiry_message.value,
      };

      try {
        const res = await fetch('https://merrito-lead-production.up.railway.app/submit-form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        const result = await res.json();

        if (res.ok && result.status) {
          form.reset();
          responseDiv.innerHTML = '<p class="text-success fw-bold">Thank you! Your enquiry has been submitted successfully.</p>';
        } else {
          throw new Error(result.message || 'Something went wrong. Please try again.');
        }
      } catch (error) {
        responseDiv.innerHTML = '<p class="text-danger mb-3">' + error.message + '</p>';
        submitButton.disabled = false;
        submitButton.innerText = 'Submit Enquiry';
      }
    });
  </script>
  <script>
    const dropdown = document.querySelector('.dropdown');
    const input = dropdown ? dropdown.querySelector('input') : null;
    const listOfOptions = dropdown ? dropdown.querySelectorAll('.option') : [];
    const body = document.body;

    const toggleDropdown = (event) => {
      event.stopPropagation();
      dropdown.classList.toggle('opened');
    };

    const selectOption = (event) => {
      input.value = event.currentTarget.textContent;
      closeDropdownFromOutside();
    };

    const closeDropdownFromOutside = () => {
      dropdown.classList.remove('opened');
    };

    body.addEventListener('click', closeDropdownFromOutside);
    if (input) input.addEventListener('click', toggleDropdown);
    listOfOptions.forEach((option) => {
      option.addEventListener('click', selectOption);
    });
  </script>

  <script>
    const toggleBtn = document.getElementById('chatbot-toggle');
    const overlay = document.getElementById('chatbot-overlay');
    let isOpen = false;

    const openChatbot = () => {
      overlay.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
      isOpen = true;
    };

    const closeChatbot = () => {
      overlay.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      isOpen = false;
    };

    toggleBtn.addEventListener('click', () => {
      isOpen ? closeChatbot() : openChatbot();
    });

    overlay.addEventListener('click', () => {
      closeChatbot();
    });

    // Prevent close when clicking inside chatbot box
    document.getElementById('chatbot').addEventListener('click', (e) => {
      e.stopPropagation();
    });
  </script>
