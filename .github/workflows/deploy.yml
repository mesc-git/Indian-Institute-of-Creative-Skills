name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main
      - sound
      - animation
      - event
      - costume
      - makeup

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Determine Target Environment
        id: env-detect
        run: |
          # Default to empty
          BUCKET=""
          DIST_ID=""

          if [ "${{ github.ref_name }}" == "main" ]; then
            BUCKET="iicsindia.org"
            DIST_ID="E1U33ZLDJEPRAP"
            
          elif [ "${{ github.ref_name }}" == "sound" ]; then
            BUCKET="sound.iicsindia.org"
            DIST_ID="E3TU4BLHKMLCNM"
            
          elif [ "${{ github.ref_name }}" == "animation" ]; then
            BUCKET="animationgaming.iicsindia.org"
            DIST_ID="E2CLP7HU09R2O6"
            
          elif [ "${{ github.ref_name }}" == "event" ]; then
            BUCKET="event.iicsindia.org"
            DIST_ID="ES0AF0HHH12F4"
            
          elif [ "${{ github.ref_name }}" == "costume" ]; then
            BUCKET="costumedesigning.iicsindia.org"
            DIST_ID="EVI51ASUI82Y3"
            
          elif [ "${{ github.ref_name }}" == "makeup" ]; then
            BUCKET="makeupandprosthetics.iicsindia.org"
            DIST_ID="E2AOBYAOIL70CA" 
            
          fi

          # Output variables to the next steps
          echo "BUCKET_NAME=$BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_ID=$DIST_ID" >> $GITHUB_ENV
          
          echo "Deploying branch '${{ github.ref_name }}' to bucket '$BUCKET'"

      - name: Sync Files to S3
        run: |
          # --delete removes files from S3 that were deleted in Git
          aws s3 sync . s3://${{ env.BUCKET_NAME }} --delete --exclude ".git/" --exclude ".github/"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_ID }} --paths "/*"
